<!DOCTYPE html>

	<link rel="stylesheet" href="../css/style.css">

<body>

	<header class="page-header">

		<h1>Practical Machine Learning</h1>

	</header>

	<main>
		<section
			id="pdf-grid"
			class="pdf-grid"
			data-course="Practical_Machine_Learning">

		<section id="pdf-viewer-section" class="pdf-viewer-section hidden">

				id="webpage-viewer"
				class="webpage-viewer"

			<h2>Downloadable files</h2>

				id="file-grid"
