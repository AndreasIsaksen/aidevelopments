<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Development</title>

	<link rel="stylesheet" href="../css/style.css">
</head>
<body>

	<header class="site-header">
		<div class="container header-inner">
			<a href="../index.html#hero" class="brand">
				<span class="logo">Andreas Isaksen</span>
			</a>

			<nav class="nav" aria-label="Primary navigation">
				<a href="../index.html#about">About</a>
				<a href="../index.html#experience">Experience</a>
				<a href="../index.html#skills">Skills</a>
				<a href="../index.html#projects">Projects</a>
				<a href="../index.html#docs">Documentation</a>
				<a href="../index.html#contact">Contact</a>
			</nav>
		</div>
	</header>

	<section class="page-header">
		<h1>Web Development</h1>
		<p>This page contains the final project, course documents, reports, and related PDF material.</p>
	</section>

	<main>
		<section
			id="pdf-grid"
			class="pdf-grid"
			data-course="Web_Development">
		</section>

		<section id="pdf-viewer-section" class="pdf-viewer-section hidden">
			<div class="pdf-viewer-header">
				<h2 id="pdf-viewer-title">Document preview</h2>
				<button id="close-pdf-viewer" type="button">Close</button>
			</div>

			<iframe
				id="pdf-viewer"
				class="pdf-viewer"
				title="PDF preview">
			</iframe>
		</section>
		<section class="webpage-section">
			<h2>Webpage Preview</h2>

			<div
				id="webpage-grid"
				class="webpage-grid"
				data-course="Web_Development">
			</div>
		</section>

		<section id="webpage-viewer-section" class="webpage-viewer-section hidden">
			<div class="webpage-viewer-header">
				<div>
					<h2 id="webpage-viewer-title"></h2>
					<p id="webpage-viewer-description"></p>
				</div>
			
				<button id="close-webpage-viewer" type="button">
					Close
				</button>
			</div>
		
			<iframe
				id="webpage-viewer"
				class="webpage-viewer"
				src=""
				title="Internal webpage preview">
			</iframe>
		</section>
		<section class="files-section">
			<h2>Downloadable files</h2>
			<div
				id="file-grid"
				class="file-grid"
				data-course="Web_Development">
			</div>
		</section>
	</main>

	<script src="../js/pdfview.js"></script>
	<script src="../js/fileLib.js"></script>
	<script src="../js/webRenderLib.js"></script>
	<script src="../js/main.js"></script>
</body>
</html>
